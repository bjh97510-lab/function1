<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Noto Sans KR', sans-serif; color: #3D3A4B;
    background: #FFF8F1;
    background-image:
      radial-gradient(circle at 8% 12%, #FFE3EC 0, transparent 32%),
      radial-gradient(circle at 92% 8%, #DDEEFF 0, transparent 30%),
      radial-gradient(circle at 70% 100%, #D5F3E6 0, transparent 38%);
    position: relative;
  }
  .deco { position: absolute; font-size: 40px; opacity: .45; }
  .wrap { position: absolute; inset: 0; padding: 58px 64px; display: grid; grid-template-columns: 1fr 430px; gap: 36px; align-items: center; }

  .badge { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #6E5DD3; font-weight: 700; font-size: 22px; padding: 8px 20px; border-radius: 999px; box-shadow: 0 4px 14px rgba(110,93,211,.15); }
  h1 { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 80px; line-height: 1.05; white-space: nowrap; color: #6E5DD3; margin: 22px 0 12px; display: flex; align-items: center; gap: 14px; letter-spacing: -1px; }
  h1 .sq { font-size: 72px; }
  .sub { font-size: 29px; font-weight: 700; line-height: 1.45; color: #4A4560; }
  .sub b { color: #E8505B; }
  .steps { display: flex; gap: 8px; margin-top: 26px; }
  .step { font-size: 19px; font-weight: 700; padding: 8px 12px; white-space: nowrap; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 2px #EEE8F6; }
  .step:nth-child(1) { background: #D5F3E6; box-shadow: none; }
  .step:nth-child(2) { background: #DDEEFF; box-shadow: none; }
  .step:nth-child(3) { background: #FFE4D2; box-shadow: none; }
  .step:nth-child(4) { background: #E6E0FC; box-shadow: none; }
  .step:nth-child(5) { background: #FFF4C7; box-shadow: none; }
  .feat { margin-top: 18px; font-size: 18px; white-space: nowrap; color: #7C7790; font-weight: 500; }

  .panel { position: relative; background: #fff; border-radius: 30px; padding: 22px; box-shadow: 0 22px 50px rgba(61,58,75,.16); }
  .panel-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .pill { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 999px; padding: 6px 16px 6px 8px; box-shadow: 0 3px 10px rgba(168,107,60,.16), inset 0 0 0 2px #F5E6D6; font-family: 'Jua'; font-size: 26px; color: #A86B3C; }
  .pill i { font-style: normal; width: 40px; height: 40px; border-radius: 50%; background: #FFF1E2; display: grid; place-items: center; font-size: 24px; }
  .pill small { font-size: 18px; color: #C9A485; }
  .eq { font-family: "Jua", sans-serif; font-size: 30px; color: #6E5DD3; background: #E6E0FC; padding: 6px 18px; border-radius: 14px; }
  svg { display: block; width: 100%; height: auto; }
  .stamp {
    position: absolute; right: -26px; bottom: -30px; width: 150px; height: 150px; border-radius: 50%;
    border: 6px solid #E8505B; color: #E8505B; background: radial-gradient(circle, #FFF5F6 60%, #FFE9EC 100%);
    box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 7px rgba(232,80,91,.5), 0 10px 24px rgba(232,80,91,.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Jua'; line-height: 1.05; transform: rotate(-14deg);
  }
  .stamp span:first-child { font-size: 52px; }
  .stamp span:last-child { font-size: 22px; }
  .flip {
    position: absolute; left: -38px; top: 120px; width: 96px; height: 128px; border-radius: 16px;
    background: linear-gradient(160deg, #FFE0E8, #fff); box-shadow: 0 10px 24px rgba(242,122,146,.28), inset 0 0 0 3px #F8C6D2;
    display: grid; place-items: center; font-size: 46px; transform: rotate(-10deg);
  }
</style>
</head>
<body>
  <span class="deco" style="top:22px;left:560px">🍂</span>
  <span class="deco" style="top:30px;right:40px">🌰</span>
  <span class="deco" style="top:520px;left:600px;font-size:30px">📈</span>
  <div class="wrap">
    <div>
      <span class="badge">📐 중학교 2학년 수학</span>
      <h1><span class="sq">🐿️</span>일차함수 탐험대</h1>
      <p class="sub">일차함수와 그 그래프를<br><b>실험하고, 풀고, 직접 그리며</b> 배워요!</p>
      <div class="steps">
        <span class="step">🌱 절편</span><span class="step">⛰️ 기울기</span><span class="step">🧩 함수식</span><span class="step">✏️ 그래프</span><span class="step">🏔️ 복합</span>
      </div>
      <p class="feat">🧪 실험실 · 🃏 카드 뒤집기 · 💡 힌트·재도전 · 🌰 도토리 → 칭찬도장</p>
    </div>

    <div class="panel">
      <div class="panel-top">
        <span class="eq">y = x + 2</span>
        <span class="pill"><i>🌰</i>7<small>/10</small></span>
      </div>
      <svg viewBox="0 0 320 250">
        <g stroke="#F1EDF9" stroke-width="1">
          <path d="M40 8V242M70 8V242M100 8V242M130 8V242M190 8V242M220 8V242M250 8V242M280 8V242M310 8V242"/>
          <path d="M10 20H312M10 50H312M10 80H312M10 110H312M10 170H312M10 200H312M10 230H312"/>
        </g>
        <g stroke="#5E5873" stroke-width="2" fill="#5E5873">
          <path d="M10 140H304"/><path d="M314 140l-10-5v10z"/>
          <path d="M160 244V14"/><path d="M160 4l-5 10h10z"/>
        </g>
        <g font-family="Noto Sans KR" font-size="14" font-style="italic" fill="#5E5873">
          <text x="300" y="130">x</text><text x="168" y="16">y</text><text x="144" y="158">O</text>
        </g>
        <!-- 기울기 삼각형 -->
        <path d="M160 80H190V50" fill="none" stroke="#FF9F6B" stroke-width="2.5" stroke-dasharray="5 4"/>
        <line x1="30" y1="210" x2="240" y2="0" stroke="#8C7BEA" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="160" cy="80" r="8" fill="#3DBE84" stroke="#fff" stroke-width="3"/>
        <circle cx="100" cy="140" r="8" fill="#FF9F6B" stroke="#fff" stroke-width="3"/>
        <g font-family="Noto Sans KR" font-weight="700" font-size="13">
          <rect x="18" y="52" width="104" height="30" rx="9" fill="#fff" stroke="#3DBE84" stroke-width="2"/>
          <text x="30" y="72" fill="#24895C">y절편 = 2</text>
          <rect x="110" y="166" width="112" height="30" rx="9" fill="#fff" stroke="#FF9F6B" stroke-width="2"/>
          <text x="122" y="186" fill="#C2622F">x절편 = −2</text>
          <text x="196" y="70" fill="#E2783F">+1</text>
        </g>
      </svg>
      <div class="stamp"><span>참</span><span>잘했어요</span></div>
    </div>
  </div>
</body>
</html>
