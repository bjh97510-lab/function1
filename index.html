<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F1">
  <title>일차함수 탐험대</title>
  <meta name="description" content="중학교 2학년 '일차함수와 그 그래프'를 절편·기울기·함수식·그래프·복합 문제 5단계로 배우는 인터랙티브 학습 앱. 실험실, 카드 뒤집기 퀴즈, 힌트와 재도전, 도토리·칭찬도장 보상까지!">

  <!-- 오픈그래프 (카카오톡·밴드·페이스북 등 링크 미리보기) -->
  <!-- ⚠️ 배포 후 og:url 과 og:image 를 실제 주소(https://...)로 바꿔 주세요. 대부분의 메신저는 절대 주소만 인식합니다. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="일차함수 탐험대">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="🐿️ 일차함수 탐험대 | 중2 일차함수와 그 그래프">
  <meta property="og:description" content="절편 → 기울기 → 함수식 → 그래프 → 복합 문제! 실험실에서 직접 움직여 보고, 카드 뒤집기 퀴즈와 50문제로 연습하며 도토리를 모아 칭찬도장을 받아요.">
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="https://example.com/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="일차함수 탐험대 — y = x + 2 그래프의 x절편과 y절편, 도토리와 칭찬도장이 그려진 소개 이미지">

  <!-- 트위터(X) 카드 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="🐿️ 일차함수 탐험대 | 중2 일차함수와 그 그래프">
  <meta name="twitter:description" content="실험실·카드 뒤집기 퀴즈·50문제로 일차함수를 배우고 도토리를 모아 칭찬도장을 받아요!">
  <meta name="twitter:image" content="https://example.com/og-image.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌰</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="css/style.css">

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/graph.js"></script>
  <script defer src="js/effects.js"></script>
  <script defer src="js/labs.js"></script>
  <script defer src="js/cards.js"></script>
  <script defer src="js/sheets.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>

  <!-- ═══════════ 로그인 화면 (항상 첫 화면) ═══════════ -->
  <section id="login-screen" class="screen active" aria-label="로그인">
    <div class="login-deco" aria-hidden="true">
      <span>🌰</span><span>📈</span><span>🍂</span><span>✏️</span><span>🌰</span>
    </div>
    <div class="login-card">
      <div class="mascot" aria-hidden="true">🐿️</div>
      <h1>일차함수 탐험대</h1>
      <p class="sub">중학교 2학년 · 일차함수와 그 그래프</p>
      <form id="login-form" novalidate>
        <label class="field">
          <span>학교 이름</span>
          <input id="login-school" type="text" placeholder="예: 홍산중학교" autocomplete="off" maxlength="30" required>
        </label>
        <label class="field">
          <span>학번</span>
          <input id="login-id" type="text" placeholder="예: 20101" inputmode="numeric" autocomplete="off" maxlength="6" required>
        </label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="btn primary big full" type="submit">탐험 시작하기 🌰</button>
      </form>
      <ol class="login-steps" aria-label="학습 순서">
        <li>🌱 절편</li><li>⛰️ 기울기</li><li>🧩 함수식</li><li>✏️ 그래프</li><li class="wide">🏔️ 복합 문제 도전</li>
      </ol>
      <p class="login-rule">🧪 단계마다 실험실 · 📝 10문제씩 · 🌰 첫 시도에 맞히면 도토리 · 💡 틀리면 힌트와 재도전</p>
      <p class="notice">※ 로그아웃하면 학습 기록과 도토리·칭찬도장이 모두 초기화돼요.</p>
    </div>
  </section>

  <!-- ═══════════ 학습 화면 ═══════════ -->
  <section id="app-screen" class="screen" aria-label="학습">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="brand-ic" aria-hidden="true">🐿️</span><span class="brand-text">일차함수 탐험대</span></div>

        <div class="rewards">
          <button type="button" class="reward acorn" id="acorn-badge" aria-label="도토리 보기">
            <span class="r-ic" aria-hidden="true">🌰</span>
            <span class="r-main">
              <span class="r-count"><b id="acorn-count">0</b><small>/10</small></span>
              <span class="r-bar"><i id="acorn-bar"></i></span>
            </span>
          </button>
          <button type="button" class="reward stamp-badge" id="stamp-badge" aria-label="칭찬도장 보기">
            <span class="stamp-mini" aria-hidden="true">참</span>
            <span class="r-count"><b id="stamp-count">0</b><small>개</small></span>
          </button>
        </div>

        <div class="user-area">
          <div class="user-meta">
            <span id="user-info" class="user-info"></span>
            <span id="sync-status" class="sync" data-kind="off"><i></i><span class="sync-text">시트 미연결</span></span>
          </div>
          <button type="button" class="icon-btn" id="sound-btn" aria-label="소리 끄기">🔊</button>
          <button type="button" class="btn small ghost" id="logout-btn">로그아웃</button>
        </div>
      </div>
      <nav id="stepper" class="stepper" aria-label="학습 단계"></nav>
    </header>

    <main id="content" class="content" tabindex="-1"></main>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
</body>
</html>
